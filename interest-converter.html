<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interest Calculator</title>
  <link rel="stylesheet" href="style.css" />
  <script defer src="script.js"></script>
  <style>
    .upload-section {
      display: none;
      flex-direction: column;
      align-items: center;
      margin: 20px 0;
    }
    .upload-section input[type="file"] {
      margin: 10px 0;
    }
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }
    .gallery-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: rgba(255, 255, 255, 0.1);
      padding: 15px;
      border-radius: 10px;
    }
    .gallery-item img,
    .gallery-item video {
      max-width: 100%;
      border-radius: 8px;
    }
    .gallery-item p {
      margin-top: 10px;
      font-size: 0.9rem;
      color: #fff;
    }
  </style>
</head>

<body>
  <div class="glass-container">
    <header>
      <h1>Interest Calculator</h1>
    </header>

    <main>
      <p>Use this page to download the Excel interest calculator or PowerPoint instructions, and privately upload related media.</p>

      <div class="button-group">
        <a href="media/interest-calculator.xlsx" download class="btn">Download Excel Calculator</a>
        <a href="media/interest-guide.pptx" download class="btn">Download PowerPoint Instructions</a>
      </div>

      <div id="uploadSection" class="upload-section">
        <input type="file" id="uploadImage" accept="image/*">
        <input type="file" id="uploadVideo" accept="video/*">
        <button class="btn" onclick="handleUpload()">Upload Media</button>
      </div>

      <section class="gallery" id="mediaGallery">
        <!-- Uploaded images and videos will appear here -->
      </section>
    </main>

    <footer>
      <p>Calculator Help Center - 55213790</p>
    </footer>
  </div>

  <script>
    let uploadVisible = false;

    document.addEventListener("keydown", (e) => {
      if ((e.ctrlKey && e.key === "5") || (e.metaKey && e.key === "5")) {
        const password = prompt("Enter upload password:");
        if (password === "27056") {
          uploadVisible = !uploadVisible;
          document.getElementById("uploadSection").style.display = uploadVisible ? "flex" : "none";
        } else {
          alert("Incorrect password.");
        }
      }

      if (e.key === "F12" || (e.ctrlKey && e.shiftKey && e.key === "I")) {
        e.preventDefault();
        alert("Developer tools are disabled.");
      }
    });

    function handleUpload() {
      const gallery = document.getElementById("mediaGallery");
      const imageFile = document.getElementById("uploadImage").files[0];
      const videoFile = document.getElementById("uploadVideo").files[0];

      if (imageFile) {
        const img = document.createElement("img");
        img.src = URL.createObjectURL(imageFile);
        const caption = document.createElement("p");
        caption.textContent = imageFile.name;
        const container = document.createElement("div");
        container.className = "gallery-item";
        container.appendChild(img);
        container.appendChild(caption);
        gallery.appendChild(container);
      }

      if (videoFile) {
        const video = document.createElement("video");
        video.src = URL.createObjectURL(videoFile);
        video.controls = true;
        const caption = document.createElement("p");
        caption.textContent = videoFile.name;
        const container = document.createElement("div");
        container.className = "gallery-item";
        container.appendChild(video);
        container.appendChild(caption);
        gallery.appendChild(container);
      }
    }

    document.addEventListener("contextmenu", (e) => e.preventDefault());
    document.addEventListener("keydown", (e) => {
      if (e.key === "F12" || (e.ctrlKey && e.shiftKey && e.key === "I")) {
        e.preventDefault();
      }
    });
  </script>
</body>

</html>
